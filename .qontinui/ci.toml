# CI manifest for the runner-as-CI-node lane
# (plan qontinui-dev-notes/plans/2026-08-07-runner-local-ci-parity-and-web-
#  configuration.md, Phase 5 — manifest coverage for the repos that had none.
#  A repo without this file cannot run on the product's local-CI lane at all.)
#
# PARITY IS A REVIEW-TIME INVARIANT — AND NOW A BUILD-TIME ONE: the steps below
# mirror the gate commands of .github/workflows/ci.yml's `lint-and-test` and
# `docs` jobs, step for step and in their order. When those jobs change, update
# this file in the SAME PR. Actions steps are referenced by NAME below, never by
# line number — line numbers in that file move constantly and a stale citation
# makes the invariant unauditable.
#
# `scripts/check-ci-manifest.cjs` (npm run ci:check-manifest, run by the
# `CI manifest ratchet` step of `lint-and-test` and mirrored below) ENFORCES that
# invariant: it reads the `# parity:` citation on each step, matches it against
# ci.yml's mirrored jobs by name, command and order, and fails on any drift. It
# also re-validates this file against the runner's parser contract — the key
# sets, argv metacharacter ban, env allowlist, timeout ceiling and working_dir
# containment transcribed from manifest.rs — so a defect in this file surfaces
# on the PR that wrote it instead of on a user's machine at dispatch time.
#
# The citations are COMMENTS rather than TOML keys because they must be: the
# runner parses `[[steps]]` with `deny_unknown_fields`, so any extra key here
# would make the whole manifest unrunnable.
#
# Commands are argv arrays (never shell strings); env is limited to the runner's
# allowlist (qontinui-runner/src-tauri/src/ci_node/manifest.rs::ENV_ALLOWLIST);
# `[limits]` values are ceilings the executor caps against host-derived sizing.
#
# qontinui-ci.yml's `build` job needs no separate mirror: every one of its steps
# ("Type check", "Redaction surface ratchet", "Lint", "Build", "Test") is a
# `--if-present` / `if [ -f … ]` guarded SUBSET of ci.yml's `lint-and-test`,
# which is mirrored in full below. Its "Install dependencies" is `npm ci ||
# npm install`, whose `||` fallback is a banned argv metacharacter and is also
# strictly weaker than `npm ci` — a resolver free to move makes two dispatches
# of one commit incomparable.
#
# ===========================================================================
# WHAT THIS MANIFEST CANNOT EXPRESS
#
# Recorded rather than silently omitted — the precedent is qontinui-coord's
# manifest header: a manifest that parses but cannot run is worse than one that
# announces why. A reviewer comparing this file against the workflows must be
# able to tell a deliberate gap from an oversight.
#
# 1. ci.yml's `python-tests` job — NOT A TOOLING GAP, A HOST-DAMAGE ONE. Its
#    three gate steps ("Lint with ruff", "Type check with mypy", "Test with
#    pytest") are each clean argv, and its install step's second line
#    (`pip install -e ".[dev]"`) is argv-expressible too. It is omitted anyway,
#    because that editable install goes into whatever interpreter is on PATH and
#    records a finder pointing at
#    `<root>/.ci-worktrees/<dispatch_id>/ui-bridge/packages/ui-bridge-python` —
#    a directory the executor DELETES at cleanup, permanently breaking `import
#    ui_bridge` in the user's own environment. Unlike the Node side there is no
#    lockfile-scoped, self-contained equivalent here (the package is
#    setuptools/pip, with no poetry venv to isolate into), and unlike an
#    ephemeral Actions runner this lane's host survives the dispatch. Giving
#    this job a mirror means giving the package a venv-scoped install path in
#    the repo — a change to the repo and to the workflow, so it is not smuggled
#    in here. Its matrix over Python 3.10/3.11/3.12 is separately unrepresentable:
#    a manifest has one PATH and one interpreter.
#
# 2. smoke-test.yml's `lint-smoke-script` job. "Bash syntax check"
#    (`bash -n scripts/smoke-test-runner.sh`) IS clean argv — and is still
#    omitted, because it would add a `bash`-on-PATH assumption on top of the
#    node/npm one. On Windows, the default Git for Windows install puts
#    `git.exe` on PATH via `Git\cmd` but NOT `bash.exe`, which lives in
#    `Git\bin`. The executor has no way to make a step conditional or
#    non-fatal, so on such a host that one-line syntax check would fail the
#    WHOLE dispatch and take the nine expressible Node gates with it. The job's
#    other two steps are unexpressible regardless: "ShellCheck (non-blocking)"
#    is a `command -v` guard with a `||` block and is declared non-blocking, and
#    "Verify npm script is wired up" wraps `node -e` in an `if !` shell block
#    whose payload itself contains `||`.
#
# 3. ci-integrity.yml's `check-self-gating` job. It runs on
#    `pull_request_target`, checks out BOTH the base and the head into separate
#    directories, and diffs them with a ~60-line bash program (`find … | while
#    read`, `diff -q`, `yq eval`, a here-string loop). It is a check ABOUT a
#    pull request's relationship to its base; this lane dispatches a single SHA
#    and has neither ref pair nor a shell to compare them with.
#
# 4. secret-scan.yml — its gitleaks step is `curl … | grep -oP … ` into
#    `curl … | tar -xz` (pipes are banned in argv) and then scopes the scan with
#    `--log-opts=<base.sha>..<head.sha>` from the pull_request event context,
#    which this lane does not have.
#
# 5. dependency-twin-resolver.yml — a scheduled (`cron`) resolver, not a PR
#    gate. Its ingest step is explicitly tolerant ("Always succeed — ingest is
#    best-effort"), needs COORD_INGEST_TOKEN, and is a multi-line curl/node
#    pipeline. A step that cannot fail is not a gate worth mirroring.
#
# 6. docs.yml, publish.yml, publish-pypi.yml — deploy and tag-triggered release
#    lanes, not PR gates, and they carry Pages/npm/PyPI publishing credentials
#    this lane must never see. docs.yml's BUILD half is not lost: ci.yml's
#    `docs` job runs the same two commands on every PR, and that job IS mirrored
#    below.
#
# 7. NO [[tools]] ARE DECLARED, AND THAT IS NOT THE SAME AS "NEEDS NOTHING".
#    The runner's tool registry (ci_node/tools.rs) provisions exactly one tool,
#    cargo-nextest, which nothing here wants. Every step below assumes `npm` and
#    `node` are already on PATH. Declaring a tool the registry does not know is a
#    validation ERROR, so the honest move is to say so rather than declare a lie.
#
#    THE VERSION IS ALSO ASSUMED, AND IT DIVERGES. ci.yml pins node 22.x for
#    `lint-and-test` (its comment: 22.x is the LTS supporting
#    `node --experimental-strip-types`, which the diagnostics generator needs)
#    and node 20.x for `docs`. This lane has ONE node, whatever the host
#    installed, for both. package.json's `engines` floor is `node >= 20`; a host
#    below that will fail these steps for a reason that is about the host, not
#    the commit.
#
# 8. NO setup-node CACHE EQUIVALENT. The Actions lane restores an npm cache
#    keyed on the lockfiles; a cold CI node downloads the full tree, which is why
#    the two install steps below carry the maximum per-step timeout.
# ===========================================================================

version = 1

# NO [[siblings]] — and here that needs saying out loud, because this repo DOES
# carry a `file:` sibling spec.
#
# package.json's devDependencies declare
# `"@qontinui/ui-bridge-auto": "file:../ui-bridge-auto"`, and
# packages/ui-bridge/package.json declares the same package at
# `file:../../../ui-bridge-auto` — different depths, but both now resolve to the
# SAME place, `<workspace>/ui-bridge-auto`, which is where the sibling actually
# lives and where the executor materialises one (a PEER of the worktree).
#
# > The root spec used to read `file:../../ui-bridge-auto`, one level too deep,
# > resolving to a directory that exists on no machine and in no lane. The lock
# > recorded it as a bare `{"dev": true}` stub — a package npm could not read —
# > and, because that phantom won the hoist at `node_modules/@qontinui/`, the
# > real sibling was forced into a duplicate nested link under
# > `packages/ui-bridge/node_modules/`. The optional peer dependency that
# > `packages/ui-bridge/src/control/action-executor.ts` delegates DOM actions to
# > was therefore unresolvable from the monorepo root on a correctly-laid-out dev
# > box. That is fixed in the same PR as this note; the phantom lock entry and
# > the duplicate nested link are both gone.
#
# Still NO [[siblings]] declaration, and the reason is unchanged by that fix:
# ci.yml checks the sibling repo out in NO job, and `npm ci` is green there
# without it (npm creates the workspace link and does not fail on a missing
# `file:` target). Declaring the sibling here would make this lane install
# something the Actions lane does not, which is the opposite of parity. The lane
# must REPRODUCE the Actions install, not improve on it.

# NO [limits] TABLE, deliberately.
#
# CiLimits carries `cargo_build_jobs` and `test_threads`; every step below is
# Node, so neither knob binds anything here. Omitting a limit means "size me
# from the host", which is the right answer when the manifest author has no
# measurement to contribute. A table of no-ops would be a lie about what has
# been measured.

# ---------------------------------------------------------------------------
# MONOREPO — mirrors ci.yml's `lint-and-test` job, step for step and in its
# order. That order is itself a gate design: the three cheap ratchets run BEFORE
# lint, so a surface change is caught even when the new file has no lint
# violation yet.
# ---------------------------------------------------------------------------

[[steps]]
name = "install"
# parity: ci.yml lint-and-test "Install dependencies"
# ci.yml "Install dependencies". `npm ci` (not `npm install`) — the lockfile is
# the input, and a resolver free to move makes two dispatches of one commit
# incomparable.
command = ["npm", "ci"]
timeout_secs = 7200

[[steps]]
name = "diagnostics-check"
# parity: ci.yml lint-and-test "Diagnostics drift check"
# ci.yml "Diagnostics drift check" → package.json `diagnostics:check` =
# `node scripts/check-diagnostics.cjs`. Re-runs the generator and fails on drift
# between diagnostics/codes.json and the committed TS/Python mirrors. The Rust
# mirror lives in qontinui-schemas and is drift-checked by that repo's own CI —
# it is not checked out here, exactly as in Actions.
command = ["npm", "run", "diagnostics:check"]

[[steps]]
name = "redaction-surface-ratchet"
# parity: ci.yml lint-and-test "Redaction surface ratchet"
# ci.yml "Redaction surface ratchet" → `redaction:check-surface` =
# `node scripts/check-redaction-surface.cjs`. Fails if the route surface or the
# Layer-2 projection-module list drifts from redaction-surface.manifest.json, so
# a new client-reachable route gets a conscious redaction decision.
command = ["npm", "run", "redaction:check-surface"]

[[steps]]
name = "dep-range-ratchet"
# parity: ci.yml lint-and-test "Dependency range ratchet"
# ci.yml "Dependency range ratchet" → `deps:check-ranges` =
# `node scripts/check-dep-ranges.cjs`.
command = ["npm", "run", "deps:check-ranges"]

[[steps]]
name = "docs-symbol-ratchet"
# parity: ci.yml lint-and-test "Documentation symbol ratchet"
# ci.yml "Documentation symbol ratchet" → `docs:check-symbols` =
# `node scripts/check-docs-symbols.cjs`. Name-checks every import in every
# fenced ts/tsx/js block on every guarded documentation surface — docs-site/docs,
# docs, packages/, examples/, and the root README.md / CONTRIBUTING.md — against
# the workspace's real package names, `exports` maps and export surfaces. It also
# fails when a tracked .md/.mdx file sits on no surface and on no declared
# exemption, so a new documentation tree cannot land unchecked. It sits in THIS
# job rather than in `docs` because the `docs` job installs only docs-site's own
# tree — packages/* is never present there, so the check would have nothing to
# resolve against.
#
# It needs no docs-site install of its own: it reads .md files and packages/*/src
# directly, and its only INSTALLED dependency is the `typescript` the root
# `npm ci` above already provides. It does require two things of the environment
# rather than of the install, and this lane is the one most likely to lack them:
# `git` on PATH, and a real git work tree. The file list comes from `git ls-files`
# so that the verdict is a property of the commit and not of whatever the working
# tree happens to have built; without it the step exits 1 saying so, because a
# gate that passes for want of anything to check is worse than one that fails.
command = ["npm", "run", "docs:check-symbols"]

[[steps]]
name = "ci-manifest-ratchet"
# parity: ci.yml lint-and-test "CI manifest ratchet"
# ci.yml "CI manifest ratchet" → `ci:check-manifest` =
# `node scripts/check-ci-manifest.cjs`. THIS STEP CHECKS THIS FILE — it validates
# the manifest against the runner's parser contract and enforces the parity
# invariant stated in the header. Running it on the local-CI lane too is not
# circular: the lane's own copy of the gate is what makes a dispatch able to
# report the same verdict Actions would, which is the point of parity.
command = ["npm", "run", "ci:check-manifest"]

[[steps]]
name = "lint"
# parity: ci.yml lint-and-test "Lint"
# ci.yml "Lint" → `lint` = `eslint "packages/*/src/**/*.{ts,tsx}"
# --max-warnings 0`. Invoked through the npm script rather than spelled out as
# argv on purpose: the script's glob is quoted so ESLINT expands it, not a
# shell, and re-spelling it here would hand the pattern to a different expander.
command = ["npm", "run", "lint"]

[[steps]]
name = "build"
# parity: ci.yml lint-and-test "Build"
# ci.yml "Build". Topological order lives in the root `build` script.
command = ["npm", "run", "build"]
timeout_secs = 7200

[[steps]]
name = "build-again"
# parity: ci.yml lint-and-test "Build again (order-independence guard)"
# ci.yml "Build again (order-independence guard)" — a SECOND identical build,
# and not redundant. The first always runs on a clean checkout so it never walks
# a workspace's populated `dist/`, which is exactly why CI stayed green through
# the esbuild externals bug fixed in dee0f20. Re-running over the built tree is
# the cheap reproduction of the state every local build after the first hits.
# Deleting this step would reopen that class silently.
command = ["npm", "run", "build"]
timeout_secs = 7200

[[steps]]
name = "typecheck"
# parity: ci.yml lint-and-test "Type check"
# ci.yml "Type check" → `typecheck` = `npm run typecheck --workspaces
# --if-present`. Runs after the builds because workspaces typecheck against each
# other's emitted declarations.
command = ["npm", "run", "typecheck"]

[[steps]]
name = "test"
# parity: ci.yml lint-and-test "Test"
# ci.yml "Test" → `test` = `npm run test --workspaces --if-present`.
# NOT `test:e2e`: that script targets the `e2e` workspace, which ci.yml does not
# run on PRs either.
command = ["npm", "run", "test"]
timeout_secs = 7200

# ---------------------------------------------------------------------------
# DOCS — mirrors ci.yml's `docs` job. A separate npm tree with its own lockfile
# (docs-site/package-lock.json), so it needs its own install; the root `npm ci`
# above does not reach it (docs-site is not in the workspaces list).
# ---------------------------------------------------------------------------

[[steps]]
name = "docs-install"
# parity: ci.yml docs "Install dependencies"
# ci.yml `docs` job, "Install dependencies".
command = ["npm", "ci"]
working_dir = "docs-site"
timeout_secs = 7200

[[steps]]
name = "docs-build"
# parity: ci.yml docs "Build documentation"
# ci.yml `docs` job, "Build documentation". This is the gate that catches a
# broken doc link or a bad MDX import before it reaches the Pages deploy in
# docs.yml, which runs the same command on main.
command = ["npm", "run", "build"]
working_dir = "docs-site"
timeout_secs = 7200
