repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Python (ui-bridge-python package)
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: ['--fix']
        files: ^packages/ui-bridge-python/

  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: node node_modules/eslint/bin/eslint.js --fix --max-warnings=-1
        language: system
        files: \.(ts|tsx)$
        exclude: ^(node_modules/|dist/|packages/.*/dist/|examples/)

      - id: block-claude-attribution
        name: Block Claude Attribution
        entry: bash .pre-commit-hooks/block-claude-attribution.sh
        language: system
        stages: [commit-msg]

ci:
  autofix_prs: true
  autofix_commit_msg: 'chore: pre-commit auto fixes'
