name: Publish to npm

# Tag-triggered publishing for ui-bridge workspace packages.
#
# Each publishable package has its own tag prefix; pushing a tag like
# `ui-bridge-eslint-plugin-v0.1.0` will derive the package name
# `ui-bridge-eslint-plugin` and publish `packages/ui-bridge-eslint-plugin`.
#
# Supported packages (must match a directory under `packages/`):
#   - ui-bridge
#   - ui-bridge-eslint-plugin
#   - ui-bridge-wrapper
#   - ui-bridge-headless
#   - ui-bridge-native (already on npm; tags reuse the same flow)
#
# To release: bump the version in the package.json, commit, then
#   git tag <package>-v<version> && git push origin <package>-v<version>
on:
  push:
    tags:
      - 'ui-bridge-v*'
      - 'ui-bridge-eslint-plugin-v*'
      - 'ui-bridge-wrapper-v*'
      - 'ui-bridge-headless-v*'
      - 'ui-bridge-native-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing — GitHub mints a short-lived
      # OIDC JWT that npm verifies against the per-package trust policy
      # configured at npmjs.com. No long-lived NPM_TOKEN secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Derive package name from tag
        id: pkg
        run: |
          tag="${{ github.ref_name }}"
          # Strip the `-v<version>` suffix to recover the package directory name.
          name="${tag%-v*}"
          if [ -z "$name" ] || [ "$name" = "$tag" ]; then
            echo "::error::Could not derive package name from tag '$tag'"
            exit 1
          fi
          if [ ! -f "packages/$name/package.json" ]; then
            echo "::error::No package.json found at packages/$name (derived from tag '$tag')"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Derived package: $name"

      - name: Install dependencies
        # The published package-lock.json was generated on a non-Linux host
        # and pins out the linux-x64-gnu Rollup native binary; even
        # `npm install` honors it. npm/cli#4828 is the upstream bug. The
        # documented fix (also in the rollup error message) is to remove
        # node_modules + package-lock.json and resolve fresh on the runner.
        # --legacy-peer-deps further bypasses the eslint@^10 vs
        # eslint-plugin-react peer conflict — benign for the publish path.
        # Lockfile drift is acceptable here; the publish path doesn't reuse
        # the lockfile downstream.
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Build
        run: npm run build --workspace=packages/${{ steps.pkg.outputs.name }}

      - name: Debug OIDC claims (temporary)
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          # Fetch the OIDC token aimed at npm and dump its claims so we can
          # see exactly what npm's trust policy is being asked to match.
          # Drop this step once trusted publishing is verified working.
          token=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "----- OIDC payload (decoded) -----"
          echo "$token" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq .

      - name: Publish
        # --provenance generates an attestation linking the npm tarball
        # back to this exact commit + workflow run, signed by the OIDC
        # token. Surfaces on the package's npm page under "Provenance".
        # Verbose logging is temporary while we verify trusted publishing.
        run: npm publish --access public --provenance --loglevel=verbose --workspace=packages/${{ steps.pkg.outputs.name }}
