name: Publish to npm

# Tag-triggered publishing for ui-bridge workspace packages.
#
# Each publishable package has its own tag prefix; pushing a tag like
# `ui-bridge-eslint-plugin-v0.1.0` will derive the package name
# `ui-bridge-eslint-plugin` and publish `packages/ui-bridge-eslint-plugin`.
#
# Supported packages (must match a directory under `packages/`):
#   - ui-bridge
#   - ui-bridge-cli-args (added 2026-07-18 — zero-dep leaf holding the shared
#     CLI flag-guard primitives; the bottom of the build graph, so it builds
#     FIRST. First publish needs its npm trusted-publisher OIDC policy set up.)
#   - ui-bridge-eslint-plugin
#   - ui-bridge-wrapper
#   - ui-bridge-headless
#   - ui-bridge-native (already on npm; tags reuse the same flow)
#   - ui-bridge-server (added 2026-05-17 — was previously published via
#     release.yml's NPM_TOKEN path; migrated to OIDC trusted-publishing
#     to close the source/registry drift at 0.4.0)
#   - create-ui-bridge-wrapper (added 2026-08-07 — the `npx` scaffolder. It is
#     not `private`, so it was always meant to publish, but it had no tag
#     prefix here and so no way to ship at all. Unscoped name, hence the bare
#     `create-ui-bridge-wrapper-v*` prefix. First publish needs its npm
#     trusted-publisher OIDC policy set up — see ui-bridge-cli-args.)
#
# To release: bump the version in the package.json and land it on the
# default branch, then tag the LANDED commit. The "Derive package name from
# tag" step refuses a tag whose version differs from that commit's manifest,
# or whose commit is not on the default branch:
#   git tag <package>-v<version> <landed sha> && git push origin <package>-v<version>
on:
  push:
    tags:
      - 'ui-bridge-v*'
      - 'ui-bridge-cli-args-v*'
      - 'ui-bridge-eslint-plugin-v*'
      - 'ui-bridge-wrapper-v*'
      - 'ui-bridge-headless-v*'
      - 'ui-bridge-native-v*'
      - 'ui-bridge-server-v*'
      - 'create-ui-bridge-wrapper-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing — GitHub mints a short-lived
      # OIDC JWT that npm verifies against the per-package trust policy
      # configured at npmjs.com. No long-lived NPM_TOKEN secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and every branch, so the tag step below can prove the
          # tagged commit is on the default branch. A depth-1 checkout of a tag
          # has no remote-tracking branch to compare against.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to 11.5.1+ for trusted publishing
        # actions/setup-node@v5 with node@20 ships npm@10.8.2, but npm
        # Trusted Publishers requires 11.5.1+. Without this, the publish
        # step sends an empty auth header and gets 404 even when the
        # OIDC + provenance flow succeeds.
        #
        # Pin to the 11.x line rather than `@latest`. `@latest` is a moving
        # target and it silently broke this workflow: npm 12 shipped with
        # `engines.node = ^22.22.2 || ^24.15.0 || >=26.0.0`, so on the node@20
        # pinned above it aborts with EBADENGINE and the release never
        # publishes (the 0.21.0 / 0.3.0 / 0.6.0 tags all failed exactly here,
        # while the identical 0.20.0 release had passed weeks earlier — the
        # only thing that changed was what `@latest` resolved to).
        # `npm@^11` supports node ^20.17.0 and is comfortably above the
        # 11.5.1 trusted-publishing floor, so it satisfies both constraints
        # and cannot drift out from under us again.
        run: npm install --global npm@^11

      - name: Derive package name from tag
        id: pkg
        env:
          # Bound through the environment, never template-expanded into the
          # script: `ui-bridge-v$(id)` is a valid tag name matching the
          # trigger globs, and an expanded `${{ }}` would run its substitution.
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag="$TAG"
          # Strip the `-v<version>` suffix to recover the package directory name.
          name="${tag%-v*}"
          if [ -z "$name" ] || [ "$name" = "$tag" ]; then
            echo "::error::Could not derive package name from tag '$tag'"
            exit 1
          fi
          if [ ! -f "packages/$name/package.json" ]; then
            echo "::error::No package.json found at packages/$name (derived from tag '$tag')"
            exit 1
          fi
          # The tag names a version as well as a package, and `npm publish`
          # ships whatever version the TAGGED COMMIT's manifest carries. A tag
          # pushed before its version bump has landed would otherwise publish a
          # different version from the one it names, or fail late at the
          # registry. Refuse here instead.
          want="${tag##*-v}"
          have=$(node -p 'require(process.argv[1]).version' "./packages/$name/package.json")
          if [ "$want" != "$have" ]; then
            echo "::error::Tag '$tag' names version $want, but packages/$name/package.json at this commit is $have. Push the tag at the commit that bumps it to $want."
            exit 1
          fi
          # Version agreement alone does not prove the release was landed: a
          # tag at an unmerged branch head that carries the bump passes it. A
          # release ships only a commit already on the default branch.
          if ! git rev-parse -q --verify "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            echo "::error::No remote-tracking ref origin/$DEFAULT_BRANCH in this checkout, so the tagged commit cannot be proven landed."
            exit 1
          fi
          # Exit 1 is "not an ancestor"; any other non-zero exit (128: a commit
          # git cannot read) decides nothing, and is reported as that.
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" && rc=0 || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::Tag '$tag' points at $GITHUB_SHA, which is not on $DEFAULT_BRANCH. Tag the commit the release landed as on $DEFAULT_BRANCH."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Could not decide whether $GITHUB_SHA is on $DEFAULT_BRANCH (git merge-base exit $rc)."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Derived package: $name@$have (commit $GITHUB_SHA, on $DEFAULT_BRANCH)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # The ui-bridge tsup DTS/worker build outgrew node's default heap:
          # the ui-bridge-v0.58.0 publish run died with
          # ERR_WORKER_OUT_OF_MEMORY (the same tree published at 0.57.0), so
          # 0.58.0 never reached npm. ubuntu-latest has 16 GB; give node 6.
          NODE_OPTIONS: --max-old-space-size=6144
        # Build packages in topological dep order so each workspace's
        # tsc step can resolve sibling-workspace types from their dist/.
        # npm workspaces uses filesystem-alphabetical order by default,
        # which doesn't respect internal dep graphs. The graph today:
        #   ui-bridge-cli-args         — leaf (zero deps; CLI flag-guard kit)
        #   ui-bridge-headless         — imports cli-args types
        #   ui-bridge                  — imports headless types
        #   ui-bridge-server           — imports ui-bridge types
        #   ui-bridge-wrapper          — imports headless types (dynamic) + cli-args
        # Other packages have no internal deps, so building the target
        # last is sufficient. Examples/e2e are intentionally not built
        # here — they're not publishable and have their own concerns.
        run: |
          npm run build --workspace=packages/ui-bridge-cli-args --if-present
          npm run build --workspace=packages/ui-bridge-headless --if-present
          npm run build --workspace=packages/ui-bridge --if-present
          npm run build --workspace=packages/${{ steps.pkg.outputs.name }} --if-present

      - name: Typecheck and test
        # Gate the publish on the target package's own typecheck + tests.
        # Without this, publish.yml was build-gated only, so a release
        # could ship type errors or failing tests that `tsup` doesn't
        # catch (it transpiles, it doesn't type-check). `--if-present`
        # keeps this a no-op for any publishable package that doesn't
        # define these scripts, so it never blocks an unrelated release.
        run: |
          npm run typecheck --workspace=packages/${{ steps.pkg.outputs.name }} --if-present
          npm test --workspace=packages/${{ steps.pkg.outputs.name }} --if-present

      - name: Dependency resolvability gate
        # Prove every internal @qontinui/* dependency of THIS package is
        # already resolvable on the registry, before making the tarball
        # installable. Build + typecheck + test all pass against workspace
        # links, so none of them can see that a dependency was never published.
        #
        # This is not hypothetical. `@qontinui/ui-bridge-cli-args` — no
        # `private` flag, its own tag prefix above, simply never tagged —
        # shipped as a hard dependency of ui-bridge-headless@0.4.0 and
        # ui-bridge-wrapper@0.7.1. Both packages' `latest` were uninstallable:
        # a clean `npm install @qontinui/ui-bridge-wrapper` died with E404 on
        # cli-args. Two releases went out that way before anyone noticed.
        #
        # For a coordinated release of several new packages, publish them in
        # dependency order — this gate is what tells you the order was wrong.
        run: node scripts/check-dep-ranges.cjs --registry --package ${{ steps.pkg.outputs.name }} --verbose

      - name: Publish
        env:
          # `npm publish` runs the package's `prepublishOnly`, which REBUILDS
          # it (`check-clean-tree && npm run build`) — a second full tsup DTS
          # build that does not inherit the Build step's env. Without the same
          # heap it dies with ERR_WORKER_OUT_OF_MEMORY exactly as the Build
          # step used to: the ui-bridge-v0.61.0 publish (run 45341531221)
          # passed Build, typecheck and tests, then OOM'd here.
          NODE_OPTIONS: --max-old-space-size=6144
        # --provenance generates an attestation linking the npm tarball
        # back to this exact commit + workflow run, signed by the OIDC
        # token. Surfaces on the package's npm page under "Provenance".
        run: npm publish --access public --provenance --workspace=packages/${{ steps.pkg.outputs.name }}
