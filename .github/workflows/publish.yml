name: Publish to npm

# Tag-triggered publishing for ui-bridge workspace packages.
#
# Each publishable package has its own tag prefix; pushing a tag like
# `ui-bridge-eslint-plugin-v0.1.0` will derive the package name
# `ui-bridge-eslint-plugin` and publish `packages/ui-bridge-eslint-plugin`.
#
# Supported packages (must match a directory under `packages/`):
#   - ui-bridge
#   - ui-bridge-cli-args (added 2026-07-18 — zero-dep leaf holding the shared
#     CLI flag-guard primitives; the bottom of the build graph, so it builds
#     FIRST. First publish needs its npm trusted-publisher OIDC policy set up.)
#   - ui-bridge-eslint-plugin
#   - ui-bridge-wrapper
#   - ui-bridge-headless
#   - ui-bridge-native (already on npm; tags reuse the same flow)
#   - ui-bridge-server (added 2026-05-17 — was previously published via
#     release.yml's NPM_TOKEN path; migrated to OIDC trusted-publishing
#     to close the source/registry drift at 0.4.0)
#
# To release: bump the version in the package.json, commit, then
#   git tag <package>-v<version> && git push origin <package>-v<version>
on:
  push:
    tags:
      - 'ui-bridge-v*'
      - 'ui-bridge-cli-args-v*'
      - 'ui-bridge-eslint-plugin-v*'
      - 'ui-bridge-wrapper-v*'
      - 'ui-bridge-headless-v*'
      - 'ui-bridge-native-v*'
      - 'ui-bridge-server-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing — GitHub mints a short-lived
      # OIDC JWT that npm verifies against the per-package trust policy
      # configured at npmjs.com. No long-lived NPM_TOKEN secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to 11.5.1+ for trusted publishing
        # actions/setup-node@v5 with node@20 ships npm@10.8.2, but npm
        # Trusted Publishers requires 11.5.1+. Without this, the publish
        # step sends an empty auth header and gets 404 even when the
        # OIDC + provenance flow succeeds.
        #
        # Pin to the 11.x line rather than `@latest`. `@latest` is a moving
        # target and it silently broke this workflow: npm 12 shipped with
        # `engines.node = ^22.22.2 || ^24.15.0 || >=26.0.0`, so on the node@20
        # pinned above it aborts with EBADENGINE and the release never
        # publishes (the 0.21.0 / 0.3.0 / 0.6.0 tags all failed exactly here,
        # while the identical 0.20.0 release had passed weeks earlier — the
        # only thing that changed was what `@latest` resolved to).
        # `npm@^11` supports node ^20.17.0 and is comfortably above the
        # 11.5.1 trusted-publishing floor, so it satisfies both constraints
        # and cannot drift out from under us again.
        run: npm install --global npm@^11

      - name: Derive package name from tag
        id: pkg
        run: |
          tag="${{ github.ref_name }}"
          # Strip the `-v<version>` suffix to recover the package directory name.
          name="${tag%-v*}"
          if [ -z "$name" ] || [ "$name" = "$tag" ]; then
            echo "::error::Could not derive package name from tag '$tag'"
            exit 1
          fi
          if [ ! -f "packages/$name/package.json" ]; then
            echo "::error::No package.json found at packages/$name (derived from tag '$tag')"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Derived package: $name"

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Build packages in topological dep order so each workspace's
        # tsc step can resolve sibling-workspace types from their dist/.
        # npm workspaces uses filesystem-alphabetical order by default,
        # which doesn't respect internal dep graphs. The graph today:
        #   ui-bridge-cli-args         — leaf (zero deps; CLI flag-guard kit)
        #   ui-bridge-headless         — imports cli-args types
        #   ui-bridge                  — imports headless types
        #   ui-bridge-server           — imports ui-bridge types
        #   ui-bridge-wrapper          — imports headless types (dynamic) + cli-args
        # Other packages have no internal deps, so building the target
        # last is sufficient. Examples/e2e are intentionally not built
        # here — they're not publishable and have their own concerns.
        run: |
          npm run build --workspace=packages/ui-bridge-cli-args --if-present
          npm run build --workspace=packages/ui-bridge-headless --if-present
          npm run build --workspace=packages/ui-bridge --if-present
          npm run build --workspace=packages/${{ steps.pkg.outputs.name }} --if-present

      - name: Typecheck and test
        # Gate the publish on the target package's own typecheck + tests.
        # Without this, publish.yml was build-gated only, so a release
        # could ship type errors or failing tests that `tsup` doesn't
        # catch (it transpiles, it doesn't type-check). `--if-present`
        # keeps this a no-op for any publishable package that doesn't
        # define these scripts, so it never blocks an unrelated release.
        run: |
          npm run typecheck --workspace=packages/${{ steps.pkg.outputs.name }} --if-present
          npm test --workspace=packages/${{ steps.pkg.outputs.name }} --if-present

      - name: Publish
        # --provenance generates an attestation linking the npm tarball
        # back to this exact commit + workflow run, signed by the OIDC
        # token. Surfaces on the package's npm page under "Provenance".
        run: npm publish --access public --provenance --workspace=packages/${{ steps.pkg.outputs.name }}
