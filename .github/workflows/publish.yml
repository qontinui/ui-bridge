name: Publish to npm

# Tag-triggered publishing for ui-bridge workspace packages.
#
# Each publishable package has its own tag prefix; pushing a tag like
# `ui-bridge-eslint-plugin-v0.1.0` will derive the package name
# `ui-bridge-eslint-plugin` and publish `packages/ui-bridge-eslint-plugin`.
#
# Supported packages (must match a directory under `packages/`):
#   - ui-bridge
#   - ui-bridge-eslint-plugin
#   - ui-bridge-wrapper
#   - ui-bridge-headless
#   - ui-bridge-native (already on npm; tags reuse the same flow)
#
# To release: bump the version in the package.json, commit, then
#   git tag <package>-v<version> && git push origin <package>-v<version>
on:
  push:
    tags:
      - 'ui-bridge-v*'
      - 'ui-bridge-eslint-plugin-v*'
      - 'ui-bridge-wrapper-v*'
      - 'ui-bridge-headless-v*'
      - 'ui-bridge-native-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Derive package name from tag
        id: pkg
        run: |
          tag="${{ github.ref_name }}"
          # Strip the `-v<version>` suffix to recover the package directory name.
          name="${tag%-v*}"
          if [ -z "$name" ] || [ "$name" = "$tag" ]; then
            echo "::error::Could not derive package name from tag '$tag'"
            exit 1
          fi
          if [ ! -f "packages/$name/package.json" ]; then
            echo "::error::No package.json found at packages/$name (derived from tag '$tag')"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Derived package: $name"

      - name: Install dependencies
        # `npm install` (not `npm ci`) because:
        #   1. --legacy-peer-deps is needed: the root project pins eslint@^10
        #      while eslint-plugin-react's published peers cap at ^9.7. The
        #      publish path doesn't lint anything, so the conflict is benign.
        #   2. npm ci has a long-standing bug with platform-optional deps
        #      (https://github.com/npm/cli/issues/4828) — Rollup's native
        #      `@rollup/rollup-linux-x64-gnu` doesn't get installed, breaking
        #      the build step. `npm install` resolves optional deps correctly.
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build --workspace=packages/${{ steps.pkg.outputs.name }}

      - name: Publish
        run: npm publish --access public --workspace=packages/${{ steps.pkg.outputs.name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
