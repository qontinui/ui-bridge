name: CI

on:
  push:
    branches:
      - main
      # Coord pushes the rebased-onto-main tip of a merge proposal to these
      # refs before it lands. Without these globs the candidate lane runs
      # almost nothing, so the tree that actually lands is less checked than
      # the PR head. See plan 2026-08-23-stacked-pr-ci-parity Phase 4.
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  # Unfiltered on purpose: a stacked PR (base != main) must get the same check
  # set as a base-on-main PR. Plan 2026-08-23-stacked-pr-ci-parity Phase 5.
  pull_request:
  # By hand, from a branch: the way to exercise the self-hosted pool path below
  # without pushing to a coord-owned merge-candidate ref.
  workflow_dispatch:

# Pinned rather than inherited from the repository default, because the jobs
# below can run on a self-hosted pool host: a job there must never hold a write
# token, and this keeps that true whatever the repository setting says. `route`
# widens its own token with `actions: read`, which its queue read needs.
permissions:
  contents: read

jobs:
  # -- Where the Linux jobs run ------------------------------------------------
  #
  # On a push (main and coord's merge-candidate*/** refs), a workflow_dispatch
  # or a same-repo pull_request, this job decides whether every job below runs on the self-hosted pool
  # `[self-hosted, Linux, X64, ram-16g]` -- on 2026-11-03 the repo-level
  # registrations nawa-uib-1..6, each carrying the classes ram-2g..ram-40g --
  # or on the free GitHub-hosted `ubuntu-latest` floor.
  #
  # WHAT REACHES THE POOL. Same-repo pull_request runs route exactly like a
  # push (decision_record self-hosted-runners-on-public-repos, amendment
  # 2026-11-04; policy production-and-cost
  # external-prs-are-prohibited-so-public-repo-ci-is-not-a-trust-boundary):
  # external PRs are prohibited on every qontinui repo, so a PR run executes
  # the same code a push run would, and repo visibility is never a reason to
  # keep it hosted. Until 2026-11-11 every pull_request stayed on the floor,
  # and this repo's PR CI queued behind the org's shared hosted pool (29 runs
  # queued, 0 in progress, while 21 of 34 org self-hosted runners idled).
  # A FORK pull_request (head repo != this repo) still goes to the floor: the
  # optional free guard that record allows on top of condition 1, the fork-PR
  # approval policy `all_external_contributors`, which stays.
  # Routing is gated on an ALLOWLIST of events (push, workflow_dispatch,
  # same-repo pull_request), not on "not a fork", so a trigger added later
  # (pull_request_target, workflow_run, issue_comment) stays on the floor until
  # someone routes it on purpose (that record's condition 3).
  #
  # WHY. The org's free hosted pool (about 20 concurrent jobs) is shared by
  # every public repo's PR CI, and coord's merge train waits behind it. Over the
  # last 8 candidates before this change (2026-11-03) these jobs queued p50
  # 12-20 min and p90 26-69 min, for runs of 0.4-9.5 min.
  #
  # The decision is the fleet's route-with-a-hosted-floor router: a VERBATIM
  # copy of qontinui-claude-config `scripts/route-ci-lane.py` (blob c67b16e7;
  # its hermetic test is `scripts/route-ci-lane-test.py` there). Re-sync by
  # copying the file again, checking `git hash-object` against ccfg's blob and
  # updating the PIN in the step below in the same change -- never by editing
  # the copy. The pin is what makes a router change visible to ci-integrity.yml,
  # which watches workflows and actions but not `.github/scripts/`: under
  # `auto`, an edited router fails the pin and the jobs go to the floor (the
  # forced `self-hosted` lane skips this job, so neither the router nor the pin
  # runs there). With `actions: read` the
  # router reads THIS repo's queued jobs and routes to the floor when the pool
  # is STALLED (a pool job queued >= 10 min), SATURATED (>= 4 queued) or its
  # signal is unreadable. The repo variable picks the lane:
  #
  #   UIBRIDGE_CI_LINUX_LANE = auto         this job runs and decides
  #                          = self-hosted  this job is SKIPPED; the routed jobs
  #                                         go to the pool with no overflow (a
  #                                         dead pool queues them up to 24 h)
  #                          = hosted | unset | anything else
  #                                         this job is SKIPPED; the routed jobs
  #                                         are hosted (the kill switch)
  #
  # THE COST OF `auto`: this job needs a hosted runner itself, so a run still
  # waits for one hosted job before its pool jobs can start, and when this job
  # picks the floor the jobs then wait in the hosted queue a second time.
  # `self-hosted` removes that wait and gives up the overflow. Setting the lane
  # only moves runs created afterwards; to free a stuck one, cancel it and
  # re-run it.
  #
  # RE-RUNS GO TO THE FLOOR, decided in each routed job's `runs-on`, not here: a
  # pool that picks jobs up and then fails them reads healthy to the queue
  # signal, and coord retries with "re-run failed jobs", which does not re-run a
  # `route` that succeeded. So `runs-on` takes the pool only on attempt 1. The
  # router ALWAYS exits 0 with outputs written (and so does the pin check
  # below), and every routed job runs under `!cancelled()` with a hosted
  # fallback, so a route job that fails, times out or is skipped leaves the
  # jobs on the floor (or, forced, on the pool) -- never SKIPPED, which coord's
  # check classification would count as passing.
  #
  # The pool label set is spelled in `--self-hosted-labels` below and in every
  # routed job's `runs-on` and `# coord-pools:` line: change them together (the
  # router counts queued pool jobs by that EXACT set;
  # `scripts/check-ci-routing.py`, run by ci-integrity-selftest.yml, fails on
  # any disagreement between them or with the router PIN). qontinui-ci.yml,
  # smoke-test.yml and ci-integrity-selftest.yml route their Linux jobs the same
  # way, with their own `route` job.
  route:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.UIBRIDGE_CI_LINUX_LANE == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      labels: ${{ steps.route.outputs.labels }}
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Route the Linux jobs
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UIBRIDGE_CI_LINUX_LANE: ${{ vars.UIBRIDGE_CI_LINUX_LANE }}
          UIBRIDGE_CI_LINUX_LANE_SOURCE: repo variable UIBRIDGE_CI_LINUX_LANE
          UIBRIDGE_CI_LINUX_HOSTED_LABEL: ubuntu-latest
          UIBRIDGE_CI_LINUX_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # PIN: the router must be ccfg's blob, byte for byte. A mismatch is
          # announced and routed to the hosted floor, never run and never red.
          want=c67b16e79f3bfaa9b92cd5e1702aa8e03e818c83
          got=$(git hash-object .github/scripts/route-ci-lane.py 2>/dev/null || echo unreadable)
          if [ "$got" != "$want" ]; then
            echo "::error title=route: router not the pinned blob::.github/scripts/route-ci-lane.py is $got, not $want. Routing to the hosted floor. Re-sync it as a verbatim copy of qontinui-claude-config scripts/route-ci-lane.py and update this pin in the same change."
            printf 'labels=["ubuntu-latest"]\nlane=hosted\nreason=router blob mismatch\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -B .github/scripts/route-ci-lane.py \
            --self-hosted-labels self-hosted,Linux,X64,ram-16g \
            --env-prefix UIBRIDGE_CI_LINUX \
            --title "CI Linux jobs" \
            --default-lane hosted \
            --hosted-on-rerun

  lint-and-test:
    # `route` above decides this job's pool. `!cancelled()` is load-bearing: on
    # a fork pull_request or a non-`auto` lane `route` is SKIPPED, and a job
    # that needs a skipped job is skipped too unless its `if` says otherwise --
    # which would turn this required context into `skipped` (= passing to
    # coord).
    needs: route
    if: ${{ !cancelled() }}

    # The pool only on a FIRST attempt of a push, workflow_dispatch or
    # same-repo pull_request run, and then only when the lane is forced
    # `self-hosted` or `route` said so under `auto` (its `labels` output). The
    # attempt and event gate covers BOTH lanes, so a fork pull_request or a
    # re-run reaches the floor here whatever `route` did. The hosted floor for
    # everything else: a fork pull_request, any re-run, the `hosted`/unset
    # lane, a route job that produced nothing.
    # The check name comes from the job and its matrix value, never from the
    # pool, so it is `lint-and-test (22.x)` on both.
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && (vars.UIBRIDGE_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]' || needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    # A backstop: on the pool a hung job holds one of six registrations for the
    # 360-minute default. Slowest seen (samples, 2026-11-03): 9.5 min hosted,
    # 15.2 min pool (pool times track the host's load). Generous on purpose: a
    # false timeout costs a whole candidate cycle, a later one only a slot.
    timeout-minutes: 45

    strategy:
      matrix:
        # 22.x: LTS that supports `node --experimental-strip-types` so the
        # diagnostics generator (scripts/gen-diagnostics.ts) runs with no
        # transpile step in `diagnostics:check`. On the pool, setup-node takes
        # it from the HOST's shared tool cache, so a new major here must be
        # provisioned on the pool hosts first (.github/actions/self-hosted-job-env
        # says why).
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5

      # SELF-HOSTED ONLY: a HOME, XDG dirs and TMPDIR of the job's own, because
      # every pool registration shares one account and one home (the action's
      # header says why it is an action and not a `run:` step).
      - name: "Self-hosted: give the job its own HOME"
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-job-env

      # The npm cache is HOSTED ONLY. setup-node keys it
      # `node-cache-<OS>-<arch>-npm-<lockfile hash>`, which names no image or
      # distro, so a pool SAVE would be exactly what every hosted run, PR runs
      # included, then restores. `package-manager-cache` guards the other door:
      # setup-node v5 caches on its own when package.json names a
      # `packageManager` and `cache` is empty (no package.json here names one
      # today).
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Diagnostics drift check
        # Re-runs scripts/gen-diagnostics.ts and fails on any drift between
        # diagnostics/codes.json and the committed TS/Python mirrors. The Rust
        # mirror lives in qontinui-schemas and is drift-checked by that repo's
        # own CI (it is not checked out here).
        run: npm run diagnostics:check

      - name: Observation envelope vendoring check
        # Re-runs scripts/sync-observation.mjs in --check mode and fails if
        # ui-bridge-native's vendored copy of the Observation envelope
        # (src/observation/observation.ts) is not byte-for-byte what the
        # canonical packages/ui-bridge/src/observation/observation.ts
        # generates. Native vendors it rather than importing
        # @qontinui/ui-bridge, which is only an optional peer there.
        run: npm run observation:check

      - name: Redaction surface ratchet
        # §4.6 Layer-3: fails if the UI Bridge route surface or the Layer-2
        # projection-module list drifts from redaction-surface.manifest.json —
        # so a new client-reachable route/projection gets a conscious redaction
        # decision. Runs before Lint (Layers 1-2) so a surface change is caught
        # even when the new file has no raw-read lint violation yet.
        run: npm run redaction:check-surface

      - name: Dependency range ratchet
        # Fails if a published package declares an internal @qontinui/* range
        # that is unbounded above, a hand-maintained OR-chain, or stale against
        # the depended-on package's current source version. Guards the
        # invariant PR #147 established; without it every one of those defects
        # is reintroducible by a single hand edit.
        run: npm run deps:check-ranges

      - name: Documentation symbol ratchet self-test
        # Pins the parsers and roster checks of the step below against fixtures.
        # It runs FIRST on purpose: a regression in that gate does not turn it
        # red, it turns it QUIET — every silent pass found there so far (a fence
        # trailing an `@example` tag, a `//` comment run split by a blank line)
        # was ACCEPTED while its siblings in the same file failed correctly, and
        # nothing about a green run distinguishes a gate that checked 496 blocks
        # from one that checked 495. So a broken gate is reported as a broken
        # gate rather than as a clean repository.
        run: npm run docs:check-symbols:test

      - name: Documentation symbol ratchet
        # Name-checks every import in every fenced ts/tsx/js block on every
        # guarded documentation surface — docs-site/docs, docs, packages/,
        # examples/, and the root README.md / CONTRIBUTING.md (see DOC_SURFACES
        # in the script) — against the workspace's real package names, `exports`
        # maps and export surfaces. The surfaces beyond docs-site matter as much
        # as it does: README.md is the repo's front door and a package's README
        # is its npm page, so an unscoped name there 404s for a reader who never
        # opens the docs site at all.
        #
        # It checks a second surface no markdown glob can reach: the COMMENTS of
        # every tracked .ts/.tsx/.mts/.cts/.js/.jsx/.mjs/.cjs source. A JSDoc
        # `@example` is documentation that ships — it renders in every IDE hover
        # and is the copy a reader is most likely to paste. #160 found two such
        # blocks importing `@anthropic-ai/ui-bridge-sdk`, a scope this project
        # has never owned, and fixed them by hand because nothing was looking;
        # the same rule now judges a fenced block wherever a reader meets it.
        # Because it reads FENCED blocks, that surface has a roster check of its
        # own: an `@example` carrying no fence — or one trailing the tag, which
        # opens no block — is read by nothing, so the step fails and names it
        # rather than passing over a blind spot in silence.
        #
        # It also refuses a published target the build never emits. A
        # package's manifest is its public API, so a target whose `dist/…` file
        # no tsup `entry` produces is ERR_MODULE_NOT_FOUND in every installed
        # copy — or, for a `bin`, `npx` failing on the first command a new user
        # runs — and it is invisible to the check above by construction, which
        # resolves every dist target back to `src`, exactly where such a target
        # still looks healthy. `@qontinui/ui-bridge` published "./discovery"
        # that way, and the `@example` importing it was reported as fully
        # VERIFIED. Every manifest field that names a built file is read, not
        # `exports` alone: `bin`, `main`, `module`, `types`, `unpkg`, `jsdelivr`
        # — so a package publishing its entry points the legacy way, with no
        # `exports` map at all, is checked rather than skipped.
        #
        # A declared entry does not guarantee a DECLARATION, so a `types`
        # target is asked one question further: an entry in a `dts: false`
        # tsup block emits the JavaScript and no `.d.ts`, so the target above
        # passes while a TypeScript consumer still gets TS2307 in every
        # installed copy. `dts: false` is only read as evidence for a package
        # whose `build` script runs no `tsc` pass; anything else is UNKNOWN
        # and is skipped rather than guessed at. Known instances are
        # enumerated in UNDECLARED_TYPE_WAIVERS with a reason, and that list
        # is exact and shrink-only — a waiver that waives nothing fails.
        #
        # The roster is also checked for COMPLETENESS: every .md/.mdx file the
        # repo tracks must be on a guarded surface or named in UNGUARDED_DOCS
        # with a reason, so a new documentation tree cannot land unchecked. The
        # file list comes from `git ls-files`, which is what keeps the verdict a
        # property of the commit rather than of whatever the working tree
        # happens to have built (coverage/, target/, .next/ ...).
        # The `docs` job cannot host this: it runs
        # `npm ci` with working-directory docs-site, so packages/* is never
        # installed there and there would be nothing to resolve against. This
        # job's root `npm ci` is what makes the check possible, which is why the
        # gate lives here beside the other ratchets rather than next to the
        # Docusaurus build it protects.
        #
        # Docusaurus validates links and MDX syntax and nothing else — it never
        # executes, type-checks or even name-checks a code block, so a page can
        # name a nonexistent package and three nonexistent exports and still
        # build green. That is exactly how it happened.
        run: npm run docs:check-symbols

      - name: CI manifest ratchet self-test
        # Pins the ratchet's no-root rule (which manifest argv would change the
        # system packages of the user's machine the local-CI lane runs on) against
        # table cases, both refused and allowed. It runs BEFORE the ratchet for
        # the reason the documentation ratchet's self-test does: a regression in
        # that rule does not turn the ratchet red, it turns it QUIET.
        run: npm run ci:check-manifest:test

      - name: CI manifest ratchet
        # Validates .qontinui/ci.toml against the runner's parser contract and
        # enforces the parity invariant that file's header declares: its steps
        # mirror this job and `docs`, step for step and in order. Without it the
        # product's local-CI lane silently drifts to running FEWER gates than
        # this one — and a lane that is green because it checks less is the
        # worst outcome for two lanes meant to agree on a verdict.
        run: npm run ci:check-manifest

      - name: Real-browser test placement self-test
        # Pins which test files reach a real browser (a value import of a
        # Playwright package, or an executablePath( call) and which do not (a
        # type-only import, a vi.mock factory, a comment), against table cases.
        # It runs BEFORE the check for the reason the self-tests above do: a
        # regression in what it recognises turns the check QUIET, not red.
        run: npm run browser-tests:check-placement:test

      - name: Real-browser test placement
        # Refuses a tracked test file that reaches a real browser but that its
        # package's `test:smoke` does not select. browser-smokes, the only job
        # with a Chromium, runs nothing but `test:smoke`, so such a test skips
        # everywhere else and runs nowhere. test-support/chromium-gate.mjs
        # refuses that at run time for a test that calls it; this step catches a
        # test with its own playwright import or executablePath( gate.
        run: npm run browser-tests:check-placement

      - name: Lint
        run: npm run lint

      - name: Build
        # Topological build order lives in the root build script — see README "Development".
        run: npm run build

      - name: Build again (order-independence guard)
        # The first build always runs on a clean checkout, so it never walks a
        # workspace's built `dist/` — which is exactly why CI stayed green
        # through the esbuild externals bug fixed in dee0f20: bundling the
        # wrapper barrel only reaches its Node-only imports once
        # ui-bridge-wrapper HAS a dist/. Every local build after the first hit
        # it; CI could not. Re-running the build over the populated tree is the
        # cheap reproduction of that state, and keeps the class fixed.
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        # The real-Chromium tests are part of this suite but SKIP here: each one
        # gates on test-support/chromium-gate.mjs, which skips when no Playwright
        # Chromium is installed, and this job installs none, so that it stays
        # mirrorable to .qontinui/ci.toml (whose lane must never install system
        # packages). They EXECUTE in the browser-smokes job below, which installs
        # Chromium, runs only `test:smoke` and fails if any of them skips. The
        # gate refuses the test file vitest is running when its package's
        # `test:smoke` does not select it, so a gated test outside a `*smoke*`
        # file fails HERE instead of running nowhere; the "Real-browser test
        # placement" step above refuses one with its own Chromium gate.
        run: npm run test

  browser-smokes:
    # The real-Chromium smokes: inject-cli frames at a DPR and the capture
    # matrix, the settle and wait smokes, the headless launcher's emulation
    # smoke and the headless example. Each one SKIPS when no Playwright Chromium
    # is installed, so until this job they passed every PR by skipping (plan
    # 2026-10-13-image-generation-and-visual-judgment, Phase 9 review m7 / B).
    #
    # Under UI_BRIDGE_REQUIRE_CHROMIUM=1 (set ONLY here) a skip is a failure:
    # the shared gate test-support/chromium-gate.mjs THROWS instead of skipping
    # when Chromium is missing, and each package's test:smoke ends with
    # test-support/assert-no-skipped-tests.mjs, which fails on a smoke that
    # skipped for any other reason or a run that executed nothing.
    #
    # A SEPARATE job on purpose. `--with-deps` installs Chromium's system
    # libraries with `sudo apt-get` on Linux. On the runner-as-CI-node lane, a
    # user's own machine, that either fails every dispatch without passwordless
    # sudo or installs system packages as root, both of which
    # .qontinui/ci.toml's header forbids. So this job is NOT mirrored there
    # (scripts/check-ci-manifest.cjs lists it in EXCLUDED_JOBS); on that lane the
    # suite runs and these smokes skip, exactly as they do in lint-and-test.
    #
    # It runs on GitHub's hosted runners, or -- routed by `route`, on a push, a
    # dispatch or a same-repo PR -- on the self-hosted pool, whose hosts carry Chromium's system
    # libraries already. A pool job must not use sudo, so there it installs the
    # browser WITHOUT `--with-deps` (the two install steps below).
    needs: route
    if: ${{ !cancelled() }}
    # Routed by `route` (its comment says how): the pool on a first attempt of a
    # push, dispatch or same-repo PR run when the lane says so, else the floor.
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && (vars.UIBRIDGE_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]' || needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    # Backstop for a hung job (slowest seen 2026-11-03: 5.3 min hosted, 8.5 pool).
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: "Self-hosted: give the job its own HOME"
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-job-env

      # npm cache hosted only, as in lint-and-test. On the pool, node 22.x comes
      # from the host's shared tool cache (provision a new major there first).
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The smokes drive the built packages: the wrapper's transports load
        # @qontinui/ui-bridge-headless and the injected bundle from their dist/.
        run: npm run build

      - name: Install Playwright Chromium
        # `npx` resolves the workspace's own playwright, so the browser build
        # matches the version the smokes import. Hosted only: `--with-deps`
        # runs `sudo apt-get`.
        if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium

      - name: "Self-hosted: install Playwright Chromium (system libraries preinstalled)"
        # The pool host is provisioned with every Playwright Chromium system
        # dependency, and a pool job must not use sudo, so this is the browser
        # alone (into the job's own HOME, which the runner deletes afterwards).
        # A library the host lacks fails at launch, naming it: that red is the
        # host's, and UIBRIDGE_CI_LINUX_LANE=hosted keeps new runs off the pool.
        if: runner.environment == 'self-hosted'
        run: npx playwright install chromium

      - name: Chromium is where the smokes look for it
        # Every smoke gates on existsSync(chromium.executablePath()). If the
        # install above left the browser anywhere else, every smoke below would
        # skip and this job would pass having run nothing.
        run: |
          node -e "
            const p = require('playwright').chromium.executablePath();
            if (!require('fs').existsSync(p)) {
              console.error('no Playwright Chromium at ' + p);
              process.exit(1);
            }
            console.log('Playwright Chromium at ' + p);
          "

      - name: Real-Chromium smokes
        env:
          UI_BRIDGE_REQUIRE_CHROMIUM: '1'
        run: npm run test:smoke

  python-tests:
    needs: route
    if: ${{ !cancelled() }}
    # Routed by `route` (its comment says how): the pool on a first attempt of a
    # push, dispatch or same-repo PR run when the lane says so, else the floor.
    # The check names stay `python-tests (3.10)` / `(3.11)` / `(3.12)`.
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && (vars.UIBRIDGE_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]' || needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    # Backstop for a hung job (slowest seen 2026-11-03: 0.9 min hosted, 1.7 pool).
    timeout-minutes: 15

    strategy:
      matrix:
        # On the pool, setup-python resolves these from the HOST's shared tool
        # cache, which is seeded with every version listed here (setup-python's
        # own manifest has no Debian builds). A version added here must be
        # seeded on the pool hosts first.
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: "Self-hosted: give the job its own HOME"
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-job-env

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Self-hosted: a virtualenv of the job's own"
        # On the pool, setup-python's interpreter is the host's SHARED tool
        # cache (/opt/hostedtoolcache), used by every registration at once.
        # Installing into it would upgrade the host's pip for every later job,
        # and `pip install -e` would point the host's one `ui_bridge` finder at
        # THIS job's checkout -- so a concurrent job on another registration
        # would test this commit's code, not its own. A venv under $RUNNER_TEMP,
        # first on PATH, takes every `python`, `pip`, `ruff`, `mypy` and
        # `pytest` below; the runner deletes it when the job ends.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" --version

      - name: Install dependencies
        working-directory: packages/ui-bridge-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: packages/ui-bridge-python
        run: ruff check .

      - name: Type check with mypy
        working-directory: packages/ui-bridge-python
        run: mypy ui_bridge

      - name: Test with pytest
        working-directory: packages/ui-bridge-python
        run: pytest

  docs:
    # The Docusaurus BUILD only. Publishing the site is docs.yml's `deploy`,
    # which holds the Pages credentials and is never routed.
    needs: route
    if: ${{ !cancelled() }}
    # Routed by `route` (its comment says how): the pool on a first attempt of a
    # push, dispatch or same-repo PR run when the lane says so, else the floor.
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && (vars.UIBRIDGE_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]' || needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    # Backstop for a hung job (slowest seen 2026-11-03: 1.9 min hosted, 4.1 pool).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: "Self-hosted: give the job its own HOME"
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-job-env

      # npm cache hosted only, as in lint-and-test. On the pool, node 20.x comes
      # from the host's shared tool cache (provision a new major there first).
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation
        working-directory: docs-site
        run: npm run build
