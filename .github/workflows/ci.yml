name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22.x: LTS that supports `node --experimental-strip-types` so the
        # diagnostics generator (scripts/gen-diagnostics.ts) runs with no
        # transpile step in `diagnostics:check`.
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Diagnostics drift check
        # Re-runs scripts/gen-diagnostics.ts and fails on any drift between
        # diagnostics/codes.json and the committed TS/Python mirrors. The Rust
        # mirror lives in qontinui-schemas and is drift-checked by that repo's
        # own CI (it is not checked out here).
        run: npm run diagnostics:check

      - name: Lint
        run: npm run lint

      - name: Build
        # Build packages in topological dep order so each workspace's
        # tsc step can resolve sibling-workspace types from their dist/.
        # npm workspaces uses filesystem-alphabetical order by default,
        # which doesn't respect internal dep graphs. The graph today:
        #   ui-bridge-headless         — leaf
        #   ui-bridge                  — imports headless types
        #   ui-bridge-server           — imports ui-bridge types
        #   ui-bridge-wrapper          — imports headless types (dynamic)
        # Build the deps explicitly first; the catch-all `--workspaces`
        # picks up everything else (and re-runs the leaves as no-ops or
        # cheap second-builds — acceptable cost for a one-shot CI step).
        run: |
          npm run build --workspace=packages/ui-bridge-headless --if-present
          npm run build --workspace=packages/ui-bridge --if-present
          npm run build --workspaces --if-present

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

  python-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: packages/ui-bridge-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: packages/ui-bridge-python
        run: ruff check .

      - name: Type check with mypy
        working-directory: packages/ui-bridge-python
        run: mypy ui_bridge

      - name: Test with pytest
        working-directory: packages/ui-bridge-python
        run: pytest

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation
        working-directory: docs-site
        run: npm run build
