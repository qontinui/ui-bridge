name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22.x: LTS that supports `node --experimental-strip-types` so the
        # diagnostics generator (scripts/gen-diagnostics.ts) runs with no
        # transpile step in `diagnostics:check`.
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Diagnostics drift check
        # Re-runs scripts/gen-diagnostics.ts and fails on any drift between
        # diagnostics/codes.json and the committed TS/Python mirrors. The Rust
        # mirror lives in qontinui-schemas and is drift-checked by that repo's
        # own CI (it is not checked out here).
        run: npm run diagnostics:check

      - name: Redaction surface ratchet
        # §4.6 Layer-3: fails if the UI Bridge route surface or the Layer-2
        # projection-module list drifts from redaction-surface.manifest.json —
        # so a new client-reachable route/projection gets a conscious redaction
        # decision. Runs before Lint (Layers 1-2) so a surface change is caught
        # even when the new file has no raw-read lint violation yet.
        run: npm run redaction:check-surface

      - name: Lint
        run: npm run lint

      - name: Build
        # Topological build order lives in the root build script — see README "Development".
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

  python-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: packages/ui-bridge-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: packages/ui-bridge-python
        run: ruff check .

      - name: Type check with mypy
        working-directory: packages/ui-bridge-python
        run: mypy ui_bridge

      - name: Test with pytest
        working-directory: packages/ui-bridge-python
        run: pytest

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation
        working-directory: docs-site
        run: npm run build
