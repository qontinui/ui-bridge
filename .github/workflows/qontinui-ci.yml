name: qontinui CI
# DO NOT DELETE THE `push:` TRIGGER, and do not narrow it past the branch list
# below. coord's merge train pushes `merge-candidate/<uuid>` and waits
# `awaiting-ci` for check-runs on that ref. A `pull_request`-only workflow can
# never satisfy it: the train times out at COORD_MERGE_CI_TIMEOUT (1800s),
# requeues forever, and permanently consumes one of COORD_MERGE_SLOTS
# (default 3). coord also judges "can this repo produce candidate CI?" purely on
# the PRESENCE of this `push:` key (`ci_baseline.rs`
# `is_candidate_check_producing_trigger` is branch-filter-blind by design), so
# deleting it trips AlertKind::MergeCandidateNoCiProducer.
#
# The three `merge-candidate*` prefixes are coord's authoritative list
# (`ci_observer.rs` CANDIDATE_BRANCH_PREFIXES_EXACT). Omitting one wedges the
# train. `main` must stay too: coord's head-baseline axis needs a `push`
# trigger that CAN fire on the default branch.
#
# WHY THIS IS SCOPED RATHER THAN THE `on: [push, pull_request]` IT REPLACED.
# An UNFILTERED `push:` also fired on every PR head branch, so every PR ran this
# workflow TWICE against the same head SHA - two runs of identical work
# competing for the same hosted-runner pool, and the PR pinned at
# mergeStateStatus=UNSTABLE until the slower duplicate drained. A `concurrency:`
# block does NOT fix it: `github.ref` differs by event (`refs/heads/<branch>` vs
# `refs/pull/<n>/merge`) so the two runs land in different groups - measured,
# qontinui-docs and qontinui-gym carry `cancel-in-progress: true` and still emit
# both runs at one SHA. Plan:
# 2026-08-31-devops-unfiltered-push-trigger-duplicates-every-pr-ci-run.
#
# `pull_request:` is deliberately left UNFILTERED so stacked PRs based on a
# long-lived integration branch still get CI.
on:
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:
  # By hand, from a branch: exercises the self-hosted pool path below without
  # pushing to a coord-owned merge-candidate ref.
  workflow_dispatch:

# Pinned, not inherited: `build` can run on a self-hosted pool host, where a job
# must never hold a write token. `route` adds `actions: read` for itself.
permissions:
  contents: read

jobs:
  # Where `build` runs: the self-hosted pool `[self-hosted, Linux, X64,
  # ram-16g]` or the hosted `ubuntu-latest` floor, decided on a push or
  # workflow_dispatch by the fleet's router (a verbatim copy of ccfg
  # `scripts/route-ci-lane.py`) under the repo variable UIBRIDGE_CI_LINUX_LANE
  # (auto | self-hosted | hosted, unset = hosted). This workflow never routes a
  # pull_request run to the pool, and every re-run goes to the floor. ci.yml's
  # `route` job carries the full explanation: the lanes, the overflow signal,
  # why re-runs are hosted and why the routed job runs under `!cancelled()`.
  # Change the label set here, in `build`'s `runs-on`, and in ci.yml together.
  route:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.UIBRIDGE_CI_LINUX_LANE == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      labels: ${{ steps.route.outputs.labels }}
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Route the Linux jobs
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UIBRIDGE_CI_LINUX_LANE: ${{ vars.UIBRIDGE_CI_LINUX_LANE }}
          UIBRIDGE_CI_LINUX_LANE_SOURCE: repo variable UIBRIDGE_CI_LINUX_LANE
          UIBRIDGE_CI_LINUX_HOSTED_LABEL: ubuntu-latest
          UIBRIDGE_CI_LINUX_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # PIN: the router must be ccfg's blob, byte for byte (ci.yml's `route`
          # comment says why). A mismatch routes to the hosted floor, never red.
          want=c67b16e79f3bfaa9b92cd5e1702aa8e03e818c83
          got=$(git hash-object .github/scripts/route-ci-lane.py 2>/dev/null || echo unreadable)
          if [ "$got" != "$want" ]; then
            echo "::error title=route: router not the pinned blob::.github/scripts/route-ci-lane.py is $got, not $want. Routing to the hosted floor. Re-sync it as a verbatim copy of qontinui-claude-config scripts/route-ci-lane.py and update this pin in the same change."
            printf 'labels=["ubuntu-latest"]\nlane=hosted\nreason=router blob mismatch\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -B .github/scripts/route-ci-lane.py \
            --self-hosted-labels self-hosted,Linux,X64,ram-16g \
            --env-prefix UIBRIDGE_CI_LINUX \
            --title "qontinui CI build" \
            --default-lane hosted \
            --hosted-on-rerun

  build:
    # `!cancelled()` keeps a skipped `route` (every pull_request) from skipping
    # this job, which coord would read as passing.
    needs: route
    if: ${{ !cancelled() }}
    # The pool on a first attempt of a push or workflow_dispatch run when the
    # lane says so, else the hosted floor. The check name stays `build`.
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (vars.UIBRIDGE_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]' || needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    # Backstop for a hung job: on the pool it would hold one of six
    # registrations for the 360-minute default (observed: 5.8-7.3 min hosted,
    # 6.8 min pool).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # SELF-HOSTED ONLY: a HOME, XDG dirs and TMPDIR of the job's own (every
      # pool registration shares one account and one home).
      - name: "Self-hosted: give the job its own HOME"
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-job-env
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check
        run: if [ -f tsconfig.json ]; then npx --yes tsc --noEmit; fi
      - name: Redaction surface ratchet
        run: npm run redaction:check-surface --if-present
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test --if-present
