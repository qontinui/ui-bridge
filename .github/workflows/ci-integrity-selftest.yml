# CI-integrity guard self-test.
#
# ci-integrity.yml decides whether a gating-workflow change is honest, so a bug
# in it either wedges every workflow PR (the defect it replaced) or -- much
# worse -- lets a gate be weakened silently. This runs the guard's own tests
# against the guard AS COMMITTED IN THIS TREE: the run-block and the Python
# helpers are extracted from .github/workflows/ci-integrity.yml at test time,
# never copied, so the tests cannot drift from the code they test. No network,
# no runner, a stubbed `gh`; a few seconds.
#
# Note the asymmetry with the guard itself: ci-integrity.yml runs from the BASE
# branch (pull_request_target), so a PR changing it is judged by main's copy.
# This workflow runs the PR's copy -- which is exactly what tests a proposed
# change to the guard before it lands.
#
# Why a separate workflow and not a ci.yml job: scripts/check-ci-manifest.cjs
# fails on any ci.yml job that is neither mirrored into .qontinui/ci.toml nor
# excused there, and this harness (bash + python3 + PyYAML) cannot run on the
# local-CI lane -- see that manifest's header, item 3.
name: CI Integrity self-test

on:
  # Same shape as ci.yml: coord pushes the rebased candidate tip to the
  # merge-candidate* refs before it lands, and an unfiltered pull_request keeps
  # stacked PRs covered.
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:
  # By hand, from a branch: exercises the self-hosted pool path below without
  # pushing to a coord-owned merge-candidate ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Where `guard-tests` runs: the self-hosted pool `[self-hosted, Linux, X64,
  # ram-16g]` or the hosted `ubuntu-latest` floor, decided on a push or
  # workflow_dispatch by the fleet's router (a verbatim copy of ccfg
  # `scripts/route-ci-lane.py`) under the repo variable UIBRIDGE_CI_LINUX_LANE
  # (auto | self-hosted | hosted, unset = hosted). This workflow never routes a
  # pull_request run to the pool, and every re-run goes to the floor. ci.yml's
  # `route` job carries the full explanation. The guard itself, ci-integrity.yml,
  # runs on pull_request_target and is NEVER routed: a base-permission trigger
  # does not get a self-hosted host (decision_record
  # self-hosted-runners-on-public-repos, condition 3). This workflow runs the
  # guard's TESTS: on every pull_request (hosted, as before), and routed only on
  # a push or dispatch.
  route:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.UIBRIDGE_CI_LINUX_LANE == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      labels: ${{ steps.route.outputs.labels }}
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Route the Linux jobs
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UIBRIDGE_CI_LINUX_LANE: ${{ vars.UIBRIDGE_CI_LINUX_LANE }}
          UIBRIDGE_CI_LINUX_LANE_SOURCE: repo variable UIBRIDGE_CI_LINUX_LANE
          UIBRIDGE_CI_LINUX_HOSTED_LABEL: ubuntu-latest
          UIBRIDGE_CI_LINUX_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # PIN: the router must be ccfg's blob, byte for byte (ci.yml's `route`
          # comment says why). A mismatch routes to the hosted floor, never red.
          want=c67b16e79f3bfaa9b92cd5e1702aa8e03e818c83
          got=$(git hash-object .github/scripts/route-ci-lane.py 2>/dev/null || echo unreadable)
          if [ "$got" != "$want" ]; then
            echo "::error title=route: router not the pinned blob::.github/scripts/route-ci-lane.py is $got, not $want. Routing to the hosted floor. Re-sync it as a verbatim copy of qontinui-claude-config scripts/route-ci-lane.py and update this pin in the same change."
            printf 'labels=["ubuntu-latest"]\nlane=hosted\nreason=router blob mismatch\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -B .github/scripts/route-ci-lane.py \
            --self-hosted-labels self-hosted,Linux,X64,ram-16g \
            --env-prefix UIBRIDGE_CI_LINUX \
            --title "CI-integrity guard tests" \
            --default-lane hosted \
            --hosted-on-rerun

  guard-tests:
    name: CI-integrity guard tests
    # `!cancelled()` keeps a skipped `route` (every pull_request) from skipping
    # this job, which coord would read as passing.
    needs: route
    if: ${{ !cancelled() }}
    # The pool on a first attempt of a push or workflow_dispatch run when the
    # lane says so, else the hosted floor. The check name stays
    # `CI-integrity guard tests`.
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (vars.UIBRIDGE_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]' || needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # SELF-HOSTED ONLY: a HOME, XDG dirs and TMPDIR of the job's own (every
      # pool registration shares one account and one home).
      - name: "Self-hosted: give the job its own HOME"
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-job-env

      - name: Shell decision logic (real run-block, stubbed gh)
        run: bash scripts/tests/ci-integrity/run-scenarios.sh

      - name: Surface differ (surface / digest / alias refusal)
        run: python3 scripts/tests/ci-integrity/test-surface.py

      # The candidate-CI routing spells the pool label set and the router pin
      # by hand in every routed workflow; this fails on any disagreement
      # (scripts/check-ci-routing.py says what each drift would do).
      - name: CI routing sites agree (label set, coord-pools, router pin)
        run: |
          python3 -B scripts/tests/ci-routing/test-check-ci-routing.py
          python3 -B scripts/check-ci-routing.py
