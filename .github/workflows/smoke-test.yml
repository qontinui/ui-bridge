name: UI Bridge Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-smoke-script:
    name: Lint smoke-test script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax check
        run: bash -n scripts/smoke-test-runner.sh

      - name: ShellCheck (non-blocking)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "Running shellcheck (warnings are informational, not blocking)..."
            shellcheck scripts/smoke-test-runner.sh || {
              echo "::warning::shellcheck reported issues — see output above."
              exit 0
            }
          else
            echo "shellcheck not installed on this runner — skipping."
          fi

      - name: Verify npm script is wired up
        run: |
          if ! node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts['smoke-test:runner']) { console.error('Missing scripts.smoke-test:runner in package.json'); process.exit(1); } console.log('Found:', p.scripts['smoke-test:runner']);"; then
            exit 1
          fi
