name: UI Bridge Smoke Test

on:
  push:
    branches:
      - main
      # Coord pushes the rebased-onto-main tip of a merge proposal to these
      # refs before it lands. Without these globs the candidate lane runs
      # almost nothing, so the tree that actually lands is less checked than
      # the PR head. See plan 2026-08-23-stacked-pr-ci-parity Phase 4.
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  # Unfiltered on purpose: a stacked PR (base != main) must get the same check
  # set as a base-on-main PR. Plan 2026-08-23-stacked-pr-ci-parity Phase 5.
  pull_request:
  workflow_dispatch:

# Pinned, not inherited: `lint-smoke-script` can run on a self-hosted pool host,
# where a job must never hold a write token. `route` adds `actions: read`.
permissions:
  contents: read

jobs:
  # Where `lint-smoke-script` runs: the self-hosted pool `[self-hosted, Linux,
  # X64, ram-16g]` or the hosted `ubuntu-latest` floor, decided on a push,
  # workflow_dispatch or same-repo pull_request by the fleet's router (a verbatim copy of ccfg
  # `scripts/route-ci-lane.py`) under the repo variable UIBRIDGE_CI_LINUX_LANE
  # (auto | self-hosted | hosted, unset = hosted). This workflow never routes a
  # FORK pull_request run to the pool (a same-repo one routes like a push), and
  # every re-run goes to the floor. ci.yml's
  # `route` job carries the full explanation. Change the label set here, in the
  # routed job's `runs-on`, and in ci.yml together.
  route:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.UIBRIDGE_CI_LINUX_LANE == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      labels: ${{ steps.route.outputs.labels }}
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Route the Linux jobs
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UIBRIDGE_CI_LINUX_LANE: ${{ vars.UIBRIDGE_CI_LINUX_LANE }}
          UIBRIDGE_CI_LINUX_LANE_SOURCE: repo variable UIBRIDGE_CI_LINUX_LANE
          UIBRIDGE_CI_LINUX_HOSTED_LABEL: ubuntu-latest
          UIBRIDGE_CI_LINUX_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # PIN: the router must be ccfg's blob, byte for byte (ci.yml's `route`
          # comment says why). A mismatch routes to the hosted floor, never red.
          want=c67b16e79f3bfaa9b92cd5e1702aa8e03e818c83
          got=$(git hash-object .github/scripts/route-ci-lane.py 2>/dev/null || echo unreadable)
          if [ "$got" != "$want" ]; then
            echo "::error title=route: router not the pinned blob::.github/scripts/route-ci-lane.py is $got, not $want. Routing to the hosted floor. Re-sync it as a verbatim copy of qontinui-claude-config scripts/route-ci-lane.py and update this pin in the same change."
            printf 'labels=["ubuntu-latest"]\nlane=hosted\nreason=router blob mismatch\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -B .github/scripts/route-ci-lane.py \
            --self-hosted-labels self-hosted,Linux,X64,ram-16g \
            --env-prefix UIBRIDGE_CI_LINUX \
            --title "Lint smoke-test script" \
            --default-lane hosted \
            --hosted-on-rerun

  lint-smoke-script:
    name: Lint smoke-test script
    # `!cancelled()` keeps a skipped `route` (a fork PR, a forced lane) from skipping
    # this job, which coord would read as passing.
    needs: route
    if: ${{ !cancelled() }}
    # The pool on a first attempt of a push, dispatch or same-repo PR run when the
    # lane says so, else the hosted floor. The check name stays
    # `Lint smoke-test script`.
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && (vars.UIBRIDGE_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]' || needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    # Backstop for a hung job (slowest seen 2026-11-03: 0.2 min on both).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # SELF-HOSTED ONLY: a HOME, XDG dirs and TMPDIR of the job's own (every
      # pool registration shares one account and one home).
      - name: "Self-hosted: give the job its own HOME"
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/self-hosted-job-env

      - name: Bash syntax check
        run: bash -n scripts/smoke-test-runner.sh

      - name: ShellCheck (non-blocking)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "Running shellcheck (warnings are informational, not blocking)..."
            shellcheck scripts/smoke-test-runner.sh || {
              echo "::warning::shellcheck reported issues — see output above."
              exit 0
            }
          else
            echo "shellcheck not installed on this runner — skipping."
          fi

      - name: Verify npm script is wired up
        run: |
          if ! node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts['smoke-test:runner']) { console.error('Missing scripts.smoke-test:runner in package.json'); process.exit(1); } console.log('Found:', p.scripts['smoke-test:runner']);"; then
            exit 1
          fi
