name: Publish to PyPI

# Tag-triggered publishing for ui-bridge-python via PyPI trusted-publishing.
#
# Tag pattern matches the existing npm-side convention (publish.yml):
#   `git tag ui-bridge-python-v0.2.1 && git push origin ui-bridge-python-v0.2.1`
#
# Trusted publisher is configured on PyPI dashboard:
#   ui-bridge-python → Manage → Publishing → GitHub Actions
#     owner: qontinui
#     repository: ui-bridge
#     workflow filename: publish-pypi.yml
#     environment: (none)
#
# No long-lived PYPI_TOKEN needed — PyPI mints a short-lived OIDC JWT and
# the action exchanges it for upload credentials. Provenance attestation
# is signed via Sigstore on the same OIDC token.
#
# Replaces the release.yml `publish-pypi` job retired by Phase 1.3 of
# `D:/qontinui-root/plans/2026-05-17-publish-discipline-migration.md`.

on:
  push:
    tags:
      - 'ui-bridge-python-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing — GitHub mints a short-lived
      # OIDC JWT that PyPI verifies against the trusted-publisher policy
      # configured at pypi.org.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/ui-bridge-python
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build + dev deps
        # Project + dev extras (pytest, mypy, ruff) plus the build tool.
        # No twine — `pypa/gh-action-pypi-publish` handles the upload via OIDC.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install build

      - name: Typecheck
        # Gates the publish step on the package's own mypy strict run.
        # Matches the npm-side discipline from publish.yml (#22).
        run: mypy ui_bridge

      - name: Test
        run: pytest

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        # OIDC + Sigstore-attested upload. No password / token in env.
        # `attestations: true` produces a PEP 740 attestation linking the
        # uploaded artifact back to this exact commit + workflow run.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/ui-bridge-python/dist/
          attestations: true
