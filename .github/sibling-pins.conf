# Which sibling COMMIT this repo's contract gate asserts against.
#
# Format: one entry per line, `<owner>/<repo>` <whitespace> `<40-hex-sha>`.
# Blank lines and `#` comments are ignored. Read by
# `qontinui/qontinui-runner/.github/actions/checkout-sibling` (referenced
# cross-repo, sha-pinned, from .github/workflows/runner-contract.yml) —
# nothing else parses this file.
#
# The format and the filename deliberately MATCH the consumer's own manifest,
# qontinui-runner/.github/sibling-pins.conf. One pin format fleet-wide beats
# two that drift.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
#
# This repo is the PRODUCER of the UI Bridge HTTP contract: `UI_BRIDGE_ROUTES`
# in packages/ui-bridge/src/server/types.ts is the source of truth, and
# qontinui-runner must expose every entry. The runner asserts that in its own
# CI (`sdk_manifest_routes_are_exposed_by_runner`).
#
# Until 2026-08-26 the runner asserted it against a FLOATING clone of this
# repo, so a land here reddened the runner's `main` within the hour, on a
# commit that touched none of it:
#
#   2026-08-20 01:57Z  this repo lands 912a3e301, adding
#                      POST /control/page/send-keys to UI_BRIDGE_ROUTES.
#                      CI here: GREEN.
#   2026-08-20 03:42Z  qontinui-runner main goes RED on a test no runner
#                      commit touched. The merge train halts for 5h+.
#
# qontinui-runner#1158 fixed the CONSUMER half by pinning. That alone trades a
# loud failure for a silent one: a pinned consumer stops breaking, but the
# contract then drifts unobserved until someone bumps the pin. Measured
# 2026-08-29, three days after that pin landed, this repo's `main` already
# declared `POST /control/visibility` with no runner handler anywhere — and
# BOTH repos were green.
#
# So this is the producer half: a route addition now fails on the ui-bridge PR
# that adds it, not later on a sibling's main. See
# .github/workflows/runner-contract.yml and scripts/check-runner-contract.mjs.
#
# ---------------------------------------------------------------------------
# BUMPING A PIN
# ---------------------------------------------------------------------------
#
# Bumping is an ordinary reviewable diff, and that is the whole point — the
# contract change shows up as a line in this file rather than as an
# unattributable red on a peer repo.
#
# The nightly `runner-contract` run compares against qontinui-runner's DEFAULT
# BRANCH with this file bypassed, and warns (never fails) when the two answers
# differ. A pin left to rot therefore shows up as a growing nightly warning
# instead of as silence.
#
# A sibling ABSENT from this file resolves to the default branch, so the pin is
# opt-in per sibling — that is the ACTION's generic behaviour, and it is NOT
# how this repo's gate treats qontinui-runner.
#
# ⚠️ DELETING THE qontinui/qontinui-runner LINE IS AN ERROR, NOT AN OPT-OUT.
# scripts/check-runner-contract.mjs asserts on every run that the tree it was
# handed came from THIS file, and compares the checked-out sha against the one
# recorded below. A missing entry therefore fails the job instead of silently
# floating the GATING run on the runner's `main` — which is the exact hazard
# .github/workflows/runner-contract.yml exists to prevent. To float on purpose
# you must also change that workflow's `mode` step, deliberately and in review.
#
# The sha comparison is not belt-and-braces: the resolver looks for a relative
# `pin-file` in the ACTION's own repo as well as this workspace, and the action
# is consumed cross-repo from qontinui-runner — which carries a
# .github/sibling-pins.conf of its own. Without the comparison, a pin from that
# file would read here as "pinned" and pass.
#
# ⚠️ TWO INDEPENDENT PINS. .github/workflows/runner-contract.yml ALSO pins a
# qontinui-runner sha — in its `uses:` for the checkout-sibling action. The two
# happen to be equal today and are NOT linked: bumping the line below does not
# move the action, and moving the action does not change which runner tree is
# compared. Decide each on its own.

qontinui/qontinui-runner	9ed902f489437bd28887331e5a94e8e338f4e846
