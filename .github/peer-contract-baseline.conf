# Accepted divergence between this repo's UI_BRIDGE_ROUTES and the route
# surface qontinui-runner exposes at the commit pinned in
# .github/sibling-pins.conf.
#
# Read by scripts/check-runner-contract.mjs. Nothing else parses this file.
#
# Format, one entry per line:
#
#   SDK_ONLY|RUNNER_ONLY <METHOD> <canonical path>  # reason
#
#   SDK_ONLY     this repo declares the route; the pinned runner does not
#                expose it.
#   RUNNER_ONLY  the pinned runner exposes the route; this repo does not
#                declare it.
#
# The path is CANONICAL: prefixed `/ui-bridge`, with every `:id` / `{id}`
# placeholder folded to `{}` — the same normalisation the runner's own
# `canonicalise_path` applies, so `{run_id}` and `:runId` are one route.
#
# **The `# reason` is REQUIRED.** A line without one is a hard error. A
# suppression whose reason nobody wrote down is how a gate goes quiet, which is
# the exact failure this whole mechanism exists to end.
#
# ---------------------------------------------------------------------------
# THIS FILE IS SELF-EMPTYING, AND THAT IS ENFORCED
# ---------------------------------------------------------------------------
#
# Every entry is checked for STALENESS on every run. A `SDK_ONLY` line the
# pinned runner now DOES expose — or one this repo no longer declares — FAILS
# the check with "delete this line". Same for `RUNNER_ONLY` in reverse.
#
# So this is a ledger of live, acknowledged divergence, not a write-only
# allow-list. It should trend toward empty.
#
# ---------------------------------------------------------------------------
# THE OTHER SIDE'S LEDGER
# ---------------------------------------------------------------------------
#
# The consumer keeps its own accepted-divergence lists — `sdk_only_baseline`
# and `runner_only_baseline`, inside
# qontinui-runner/src-tauri/src/mcp/ui_bridge/mod.rs. This checker READS those
# at the pinned commit and applies them before consulting this file, so a
# divergence the runner has already accepted never needs a line here. Do NOT
# copy the runner's entries into this file — a second copy would fork the
# moment the runner edits its own.
#
# A divergence that is intentional and PERMANENT belongs in the runner's list,
# not here. This file is for divergence that is real, current, and expected to
# be resolved.

SDK_ONLY POST /ui-bridge/control/visibility  # Occlusion sweep (types.ts, handler 'visibility'); no runner handler exists — measured 2026-08-29, both repos green because the runner was pinned behind it. Delete this line once qontinui-runner exposes the route (or accepts it in its own sdk_only_baseline).
